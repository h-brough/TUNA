[build-system]
requires = [
  "setuptools>=77",
  "wheel",
  "Cython>=0.29",
  "numpy>=1.26.0",
  "scipy>=1.15.0"
]
build-backend = "setuptools.build_meta"

[project]
name = "QuantumTUNA"
dynamic = ["version"]
authors = [
  { name = "Harry Brough", email = "harry.brough@manchester.ac.uk"}
]
keywords = ["quantum chemistry", "molecular physics", "hartree-fock", "mp2", "dft", "coupled cluster", "theoretical chemistry", "computational chemistry", "molecular modeling"]
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "termcolor",
]

description = "A streamlined quantum chemistry program for atoms and diatomics."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: Unix",
  "Programming Language :: Python",
  "Programming Language :: Cython",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Topic :: Scientific/Engineering",
]


[tool.setuptools.packages.find]
where = ["."]
include = ["TUNA", "TUNA.tuna_integrals*"]

[project.scripts]
tuna = "TUNA.tuna:main"
TUNA = "TUNA.tuna:main"

[tool.setuptools.package-data]
"TUNA" = ["*.pdf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: takes many energy evaluations, deselect with -m 'not slow'",
]

[project.urls]
Repository = "https://github.com/h-brough/TUNA"
Documentation = "https://github.com/h-brough/TUNA/blob/main/docs/TUNA%20Manual.pdf"
Changelog = "https://github.com/h-brough/TUNA/blob/main/docs/CHANGELOG.md"
