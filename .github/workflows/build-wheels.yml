name: Test, build and publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# Least privilege by default. The publish job asks for id-token separately.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install libomp
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip "setuptools>=77" wheel
          python -m pip install cython numpy scipy matplotlib termcolor pytest

      - name: Build the integral extension in place
        run: python setup.py build_ext --inplace

      - name: Run the test suite
        run: python -m pytest -v --durations=10

  sdist:
    name: Build and verify the sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      # An sdist that cannot be installed is worse than no sdist at all, because pip
      # falls back to it on every platform and interpreter without a matching wheel.

      - name: Install from the sdist and run the suite against it
        run: |
          python -m pip install pytest
          python -m pip install dist/*.tar.gz
          cd "$(mktemp -d)"
          pytest -q "$GITHUB_WORKSPACE/tests"

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  build-wheels:
    name: Wheels (${{ matrix.os }})
    needs: [test, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: 3.12
            cibw_build: "cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64 cp314t-manylinux_x86_64 cp315-manylinux_x86_64 cp315t-manylinux_x86_64"
          - os: macos-15
            python-version: 3.12
            cibw_build: "cp312-macosx_* cp313-macosx_* cp314-macosx_* cp314t-macosx_* cp315-macosx_* cp315t-macosx_*"
          - os: windows-latest
            python-version: 3.12
            cibw_build: "cp312-win_amd64 cp313-win_amd64 cp314-win_amd64 cp314t-win_amd64"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: "x64"

      - name: Install cibuildwheel
        run: python -m pip install --upgrade pip cibuildwheel

      - name: Build wheels
        env:
          CIBW_BUILD: ${{ matrix.cibw_build }}
          CIBW_ARCHS_WINDOWS: "AMD64"
          CIBW_BEFORE_ALL_MACOS: "brew install libomp"
          CIBW_ENVIRONMENT_MACOS: MACOSX_DEPLOYMENT_TARGET=15.0
          CIBW_SKIP: "*-win32"
          CIBW_BEFORE_BUILD: >
            python -m pip install -U pip "setuptools>=77" wheel cython &&
            python -m pip install --only-binary=:all: numpy>=1.26 scipy>=1.11.0 harfbuzz &&
            python -m pip install matplotlib
          # Run the real suite against every wheel, on the interpreter it was built
          # for and from a temporary directory. This is what catches a wheel that
          # imports on the build machine but not on a clean one, which for TUNA
          # means a missing or unbundled libomp.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: pytest -q {project}/tests
        run: python -m cibuildwheel --output-dir wheelhouse

      - name: Upload built wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build-wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    # Recommended for trusted publishing, but create the environment in the
    # repository settings first or the job will fail to start:
    # environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI (Trusted Publisher)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
